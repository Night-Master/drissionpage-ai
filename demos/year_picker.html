<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Year Picker Wheel Test</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1e293b;
               font-family: -apple-system, "PingFang SC", sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; padding-top: 60px; }
  #picker { width: 260px; background: #0f172a; border: 2px solid #334155; border-radius: 16px;
            padding: 28px 0; text-align: center; cursor: ns-resize; user-select: none; }
  #year { font-size: 72px; font-weight: 700; color: #f8fafc; letter-spacing: 2px; }
  #picker .hint { color: #64748b; font-size: 14px; margin-top: 8px; }
  #picker:hover { border-color: #60a5fa; }
  #hover-badge { margin-top: 16px; font-size: 16px; color: #94a3b8; }
  #hover-badge.on { color: #4ade80; font-weight: 700; }
  #log { margin-top: 16px; width: 420px; height: 120px; overflow: hidden; background: #020617;
         border-radius: 8px; color: #38bdf8; font: 12px/1.6 monospace; padding: 8px 12px; }
  #wheel-count { color: #fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <div id="picker">
    <div id="year">2000</div>
    <div class="hint">悬停后用鼠标滚轮选择年份</div>
  </div>
  <div id="hover-badge">hovered: no</div>
  <div id="log">wheel events: <span id="wheel-count">0</span></div>
</div>
<script>
  var year = 2000, MIN = 1950, MAX = 2026, wheelCount = 0;
  var yearEl = document.getElementById('year');
  var picker = document.getElementById('picker');
  var badge = document.getElementById('hover-badge');
  var log = document.getElementById('log');
  var countEl = document.getElementById('wheel-count');

  picker.addEventListener('wheel', function (e) {
    e.preventDefault();
    wheelCount += 1;
    year = Math.max(MIN, Math.min(MAX, year + Math.round(e.deltaY / 120)));
    yearEl.textContent = year;
    countEl.textContent = wheelCount;
    log.innerHTML += '<br>wheel deltaY=' + Math.round(e.deltaY) + ' -> year=' + year;
    log.scrollTop = log.scrollHeight;
  }, { passive: false });

  picker.addEventListener('mouseover', function () {
    badge.textContent = 'hovered: yes';
    badge.className = 'on';
  });
  picker.addEventListener('mouseleave', function () {
    badge.textContent = 'hovered: no';
    badge.className = '';
  });
</script>
</body>
</html>
